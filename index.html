<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ChessBox — an embeddable, customizable chess puzzle widget powered by Lichess and Chessground." />
  <title>ChessBox</title>

  <!-- Chessground base CSS -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@lichess-org/chessground@10.1.1/assets/chessground.base.min.css" />

  <!-- ChessBox styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="puzzle-widget" id="puzzle-widget">

    <!-- ============================================================
         BOARD AREA
         ============================================================ -->
    <div class="board-area" id="board-area">
      <span id="puzzle-theme"></span>
      <div id="board" class="cg-wrap"></div>

      <div id="turn-indicator">
        <img id="turn-piece" src="" alt="" />
        <span class="turn-label" id="turn-text"></span>
      </div>

      <div id="puzzle-banner"></div>
      <div id="info-toast"></div>
    </div>

    <!-- ============================================================
         CONTROLS
         ============================================================ -->
    <div class="puzzle-controls">
      <button id="btn-hint" data-i18n-title="hint">
        <svg viewBox="0 0 24 24">
          <path d="M9 18h6"/><path d="M10 22h4"/>
          <path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>
        </svg>
      </button>
      <button id="btn-solution" data-i18n-title="solution">
        <svg viewBox="0 0 24 24">
          <circle cx="7.5" cy="15.5" r="4.5"/>
          <path d="M10.5 12.5 21 2"/><path d="M18 5l3 3"/><path d="M15 8l3 3"/>
        </svg>
      </button>
      <button id="btn-reset" data-i18n-title="reset">
        <svg viewBox="0 0 24 24">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </svg>
      </button>
      <button id="btn-next" data-i18n-title="next">
        <svg viewBox="0 0 24 24">
          <polyline points="9 18 15 12 9 6"/>
          <line x1="21" y1="6" x2="21" y2="18"/>
        </svg>
      </button>
      <button id="btn-expand" data-i18n-title="expand">
        <svg viewBox="0 0 24 24">
          <polyline points="15 3 21 3 21 9"/>
          <polyline points="9 21 3 21 3 15"/>
          <line x1="21" y1="3" x2="14" y2="10"/>
          <line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
      </button>
      <button id="btn-history" data-i18n-title="history">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <polyline points="12 7 12 12 15 14"/>
        </svg>
      </button>
      <button id="btn-lupa" data-i18n-title="info">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </div>

    <!-- ============================================================
         MOVE HISTORY
         ============================================================ -->
    <div class="move-history" id="move-history"></div>

    <!-- ============================================================
         CONFIGURATION PANEL
         ============================================================ -->
    <div class="puzzle-selector" id="puzzle-selector">

      <!-- Puzzle theme -->
      <label for="sel-theme" data-i18n="theme"></label>
      <select id="sel-theme">
        <option value="" data-i18n="theme_any"></option>
        <option value="mateIn1">Mate in 1</option>
        <option value="mateIn2">Mate in 2</option>
        <option value="mateIn3">Mate in 3</option>
        <option value="fork">Fork</option>
        <option value="pin">Pin</option>
        <option value="skewer">Skewer</option>
        <option value="discoveredAttack">Discovered attack</option>
        <option value="sacrifice">Sacrifice</option>
        <option value="hangingPiece">Hanging piece</option>
        <option value="trappedPiece">Trapped piece</option>
        <option value="backRankMate">Back rank mate</option>
        <option value="smotheredMate">Smothered mate</option>
        <option value="endgame">Endgame</option>
        <option value="middlegame">Middlegame</option>
        <option value="opening">Opening</option>
        <option value="advantage">Advantage</option>
        <option value="crushing">Crushing</option>
        <option value="equality">Equality</option>
      </select>

      <!-- Level -->
      <label data-i18n="level"></label>
      <div class="level-dropdown" id="level-dropdown">
        <div class="trigger" id="level-trigger">
          <span id="level-trigger-icon"></span>
          <span class="level-name" id="level-trigger-name"></span>
          <span class="level-range" id="level-trigger-range"></span>
          <svg class="arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="menu" id="level-menu"></div>
      </div>

      <!-- Rating -->
      <label for="inp-rating" data-i18n="rating"></label>
      <input id="inp-rating" type="text" inputmode="numeric" placeholder="1500" />
      <p class="hint-text" data-i18n="rating_hint"></p>

      <!-- Search -->
      <label for="inp-search" data-i18n="search"></label>
      <div class="row">
        <input id="inp-search" type="text" placeholder="fork, pin, mate..." />
        <button id="btn-search" data-i18n="search_btn"></button>
      </div>

      <!-- Board color -->
      <label data-i18n="board_color"></label>
      <div class="preview-row">
        <div class="board-preview" id="board-preview"></div>
        <select id="sel-board-color" style="flex:1;">
          <optgroup label="2D">
            <option value="blue">Blue (Lichess)</option>
            <option value="green">Green</option>
            <option value="brown">Brown</option>
            <option value="gray">Gray</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="wood">Wood</option>
            <option value="marble">Marble</option>
            <option value="purple">Purple</option>
          </optgroup>
          <optgroup label="3D">
            <option value="3d-wood">3D Wood</option>
            <option value="3d-marble">3D Marble</option>
            <option value="3d-dark">3D Dark</option>
          </optgroup>
          <option value="custom" data-i18n="custom"></option>
        </select>
      </div>
      <div id="custom-colors" class="custom-color-row" style="display:none;">
        <input type="color" id="inp-custom-light" value="#dee3e6" />
        <input type="text" id="inp-custom-light-hex" placeholder="#dee3e6" maxlength="7" />
        <input type="color" id="inp-custom-dark" value="#4a75a0" />
        <input type="text" id="inp-custom-dark-hex" placeholder="#4a75a0" maxlength="7" />
      </div>

      <!-- Piece set (populated by JS) -->
      <label data-i18n="piece_set"></label>
      <div class="preview-row">
        <div class="piece-preview">
          <img id="piece-preview-img" src="https://lichess1.org/assets/piece/cburnett/wN.svg" alt="" />
        </div>
        <select id="sel-piece-set" style="flex:1;"></select>
      </div>

      <!-- Widget background -->
      <label for="sel-widget-bg" data-i18n="widget_bg"></label>
      <div class="row">
        <select id="sel-widget-bg" style="flex:1;">
          <option value="white" data-i18n="bg_white"></option>
          <option value="transparent" data-i18n="bg_transparent"></option>
          <option value="black" data-i18n="bg_black"></option>
          <option value="custom" data-i18n="custom"></option>
        </select>
        <input type="color" id="inp-bg-color" value="#1a1a2e"
               style="width:40px;height:32px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;background:transparent;cursor:pointer;padding:2px;" />
      </div>

      <!-- Orientation -->
      <label for="sel-orientation" data-i18n="orientation"></label>
      <select id="sel-orientation">
        <option value="auto" data-i18n="orient_auto"></option>
        <option value="white" data-i18n="orient_white"></option>
        <option value="black" data-i18n="orient_black"></option>
      </select>

      <!-- Export -->
      <label data-i18n="export"></label>
      <div class="row">
        <button id="btn-export-pgn">PGN</button>
        <button id="btn-export-fen">FEN</button>
      </div>

    </div>
  </div>

  <!-- ============================================================
       CUSTOM MODAL (replaces window.confirm / alert / prompt)
       ============================================================ -->
  <div class="cb-modal-overlay" id="cb-modal-overlay">
    <div class="cb-modal">
      <h3 id="cb-modal-title"></h3>
      <div class="cb-modal-body" id="cb-modal-body"></div>
      <div class="cb-modal-actions" id="cb-modal-actions"></div>
    </div>
  </div>

  <!-- ============================================================
       ENTRY POINT
       ============================================================ -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
